name: Release artifacts

on:
  release:
    types:
      - published
  workflow_run:
    workflows:
      - Release-plz
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag for an existing GitHub release
        required: true

jobs:
  linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    env:
      BIN: stow
      TARGET: x86_64-unknown-linux-musl
      PACKAGE_PLATFORM: linux-x86_64-static
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Resolve release artifact
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          tag="${EVENT_TAG:-}"
          if [[ -z "${tag}" ]]; then
            tag="${INPUT_TAG:-}"
          fi

          if [[ -z "${tag}" ]]; then
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
            tag="${BIN}-v${version}"
          else
            version="${tag#"$BIN"-v}"
          fi

          package="${BIN}-${version}-${PACKAGE_PLATFORM}"
          archive="${package}.tar.gz"
          checksum="${archive}.sha256"

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
              echo "No GitHub release ${tag}; skipping artifact build."
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "GitHub release ${tag} does not exist." >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]] && \
            gh release view "${tag}" --json assets --jq '.assets[].name' | grep -Fxq "${archive}" && \
            gh release view "${tag}" --json assets --jq '.assets[].name' | grep -Fxq "${checksum}"; then
            echo "Release ${tag} already has ${archive} and ${checksum}; skipping."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "package=${package}"
            echo "archive=${archive}"
            echo "checksum=${checksum}"
            echo "skip=false"
          } >> "${GITHUB_OUTPUT}"

      - name: Install Rust toolchain
        if: steps.release.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl C toolchain
        if: steps.release.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build release binary
        if: steps.release.outputs.skip != 'true'
        run: cargo build --release --locked

      - name: Package artifact
        if: steps.release.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "dist/pkg/${{ steps.release.outputs.package }}"
          cp "target/${TARGET}/release/${BIN}" "dist/pkg/${{ steps.release.outputs.package }}/"
          cp README.md LICENSE "dist/pkg/${{ steps.release.outputs.package }}/"
          tar \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C dist/pkg \
            -czf "dist/${{ steps.release.outputs.archive }}" \
            "${{ steps.release.outputs.package }}"
          (cd dist && sha256sum "${{ steps.release.outputs.archive }}" > "${{ steps.release.outputs.checksum }}")

      - name: Upload workflow artifact
        if: steps.release.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.archive }}
          path: |
            dist/${{ steps.release.outputs.archive }}
            dist/${{ steps.release.outputs.checksum }}

      - name: Upload release artifact
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            "dist/${{ steps.release.outputs.archive }}" \
            "dist/${{ steps.release.outputs.checksum }}" \
            --clobber
